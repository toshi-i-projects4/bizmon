<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>従業員サーベイのご案内｜ビズけあ</title>
<link rel="icon" href="/favicon.ico?v=20260723" type="image/x-icon">
<link rel="shortcut icon" href="/favicon.ico?v=20260723" type="image/x-icon">
<style>
:root{--blue:#0ea5e9;--blue-dark:#0284c7;--navy:#0f172a;--line:#e5e7eb;--bg:#f5f7fb;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:#111827;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:36px;max-width:520px;width:100%;box-sizing:border-box}
.page-logo{width:150px;display:block;margin:0 auto 16px}
h1{font-size:20px;color:var(--navy);margin:0 0 6px;text-align:center}
.sub{font-size:13px;color:var(--muted);margin-bottom:22px;text-align:center}
.privacy{background:#f0f9ff;border:1px solid #bae6fd;border-left:4px solid var(--blue);border-radius:12px;padding:14px 16px;font-size:13px;color:#075985;line-height:1.8;margin-bottom:22px}
button{width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
button:hover{background:var(--blue-dark)}
button:disabled{background:#cbd5e1;cursor:not-allowed}
.msg{font-size:13px;border-radius:10px;padding:10px 12px;margin-bottom:16px;display:none}
.msg.show{display:block}
.msg.error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.loading{text-align:center;color:var(--muted);font-size:13px;padding:30px}
</style>
</head>
<body>
<div class="card">
  <div id="loading" class="loading">読み込み中…</div>
  <div id="content" style="display:none">
    <img src="logo.png" alt="ビズけあ" class="page-logo">
    <h1>従業員サーベイのご案内</h1>
    <div class="sub" id="companyLine"></div>
    <div id="msg" class="msg error"></div>
    <div class="privacy" id="modeNotice">読み込み中...</div>
    <button id="startBtn">回答を始める</button>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const params = new URLSearchParams(location.search);
const companyId = params.get("company");
const token = params.get("token");

const loadingEl = document.getElementById("loading");
const contentEl = document.getElementById("content");
const msgEl = document.getElementById("msg");

function showError(text) { msgEl.textContent = text; msgEl.classList.add("show"); }

async function init() {
  if (!companyId || !token) {
    loadingEl.textContent = "サーベイのリンクが正しくありません。ご案内のURLをご確認ください。";
    return;
  }
  try {
    if (!auth.currentUser) { await signInAnonymously(auth); }
    const companySnap = await getDoc(doc(db, "companies", companyId));
    if (!companySnap.exists()) throw new Error("company not found");
    const inviteRef = doc(db, "companies", companyId, "surveyInvites", token);
    const inviteSnap = await getDoc(inviteRef);
    if (!inviteSnap.exists()) throw new Error("invite not found");
    const invite = inviteSnap.data();
    if (invite.status === "completed") {
      loadingEl.textContent = "このリンクでのサーベイ回答はすでに完了しています。";
      return;
    }
    if (invite.status === "cancelled") {
      loadingEl.textContent = "このリンクは対象外となり、現在は回答できません。ご不明な点は会社の担当者にご確認ください。";
      return;
    }

    document.getElementById("companyLine").textContent = `${companySnap.data().companyName} 御中`;
    document.getElementById("modeNotice").textContent = invite.mode === "named"
      ? "このサーベイは会社の設定により「記名式」です。回答は会社の担当者・産業医が個人ごとに確認できます。"
      : "このサーベイは会社の設定により「無記名」です。個人が特定されない形で扱われます。";

    loadingEl.style.display = "none";
    contentEl.style.display = "block";

    document.getElementById("startBtn").addEventListener("click", () => {
      sessionStorage.setItem("bizukea_survey_company", companyId);
      sessionStorage.setItem("bizukea_survey_token", token);
      sessionStorage.setItem("bizukea_survey_name", invite.name || "");
      sessionStorage.setItem("bizukea_survey_department", invite.department || "");
      // 集団分析（サーベイ分析結果）の匿名集計に使うため、部署・属性・実施サイクルIDも
      // 引き継ぐ（個人が特定される氏名・メールアドレス等は含めない）。
      sessionStorage.setItem("bizukea_survey_department1", invite.department1 || "");
      sessionStorage.setItem("bizukea_survey_department2", invite.department2 || "");
      sessionStorage.setItem("bizukea_survey_department3", invite.department3 || "");
      sessionStorage.setItem("bizukea_survey_gender", invite.gender || "");
      sessionStorage.setItem("bizukea_survey_ageGroup", invite.ageGroup || "");
      sessionStorage.setItem("bizukea_survey_tenureGroup", invite.tenureGroup || "");
      sessionStorage.setItem("bizukea_survey_employmentType", invite.employmentType || "");
      sessionStorage.setItem("bizukea_survey_cycleId", invite.cycleId || "");
      location.href = "survey.html?company=" + encodeURIComponent(companyId) + "&token=" + encodeURIComponent(token);
    });
  } catch (err) {
    console.error(err);
    loadingEl.textContent = "サーベイのリンクが無効です。会社の担当者にご確認ください。";
  }
}
init();
</script>
</body>
</html>
